spring:
  docker:
    compose:
      skip:
        in-tests: false
  sql:
    init:
      mode: always       # schema.sql 실행
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: update                          # 애플리케이션 실행 시 DB 스키마 자동 업데이트
    properties:
      org.hibernate.envers.store_data_at_delete: true # envers가 삭제도 상세하게 기록하게함.
      hibernate:
        show_sql: false
        format_sql: true                        # 출력되는 SQL 쿼리를 보기 좋게 포맷팅
        highlight_sql: true                     # 콘솔에서 SQL 쿼리를 하이라이트 처리 (색상)
        jdbc:
          batch_size: 50   # 배치 사이즈 (업데이트/삭제 배치)
        order_updates: true        # UPDATE 정렬 (배치 효율 증가)

  thymeleaf:
    encoding: UTF-8
    cache: false    # 캐시 설정
    prefix: classpath:/templates/
    suffix: .html

  messages:
    basename: messages,errors
    encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true


  level:
    org:
      hibernate:
        SQL: DEBUG                   # Hibernate SQL 쿼리 출력
        orm.jdbc.bind: TRACE         # Hibernate SQL 파라미터 바인딩 출력
      springframework.jdbc: DEBUG       # Spring JDBC Template 쿼리 실행 로그

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: study-commerce-server

file:
  review-image-dir: ${user.home}/Desktop/review-images/

